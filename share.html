<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2ea44f">
    <title>Choose Post Type</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/webp" href="./icon.webp">
    <link rel="stylesheet" href="./styles.css">
</head>

<body class="page-share">
    <div class="container">
        <h1>Create GitHub Post</h1>

        <div class="fields">
            <div class="field">
                <label for="f-title">Title</label>
                <input type="text" id="f-title" placeholder="Post title">
            </div>

            <div class="field">
                <label for="f-url">URL</label>
                <input type="url" id="f-url" placeholder="https://example.com">
            </div>

            <div class="field">
                <label for="f-notes">Notes <span class="hint">(optional — used for Bookmark / Response)</span></label>
                <textarea id="f-notes" rows="5" placeholder="Add a quote or commentary…"></textarea>
            </div>

            <div class="field">
                <label for="f-response-type">Response type <span class="hint">(for 💬 Response)</span></label>
                <select id="f-response-type">
                    <option value="reply">reply</option>
                    <option value="reshare">reshare</option>
                    <option value="star">star</option>
                    <option value="rsvp">rsvp</option>
                </select>
            </div>
        </div>

        <p class="edit-note">✏️ Edit above, then pick a type. GitHub opens the form prefilled with
            these values — just review and submit (edits made here stick; editing on GitHub can reset).</p>

        <button class="btn" id="bookmark-btn">
            <span class="icon">🔖</span>
            Bookmark
        </button>

        <button class="btn" id="response-btn">
            <span class="icon">💬</span>
            Response
        </button>

        <button class="btn" id="readlater-btn">
            <span class="icon">📖</span>
            Read It Later
        </button>

        <div class="info" id="page-info">
            Loading shared content...
        </div>
    </div>

    <script src="./share.js"></script>
</body>

</html>
