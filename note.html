<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2ea44f">
    <title>New Note</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/webp" href="./icon.webp">
    <link rel="stylesheet" href="./styles.css">
</head>

<body class="page-share">
    <div class="container">
        <a class="home-link" href="./index.html">← Home</a>
        <h1>New note</h1>

        <div class="fields">
            <div class="field">
                <label for="n-title">Title</label>
                <input type="text" id="n-title" placeholder="Note title">
            </div>

            <div class="field">
                <label for="n-content">Content <span class="hint">(Markdown supported)</span></label>
                <textarea id="n-content" rows="9" placeholder="Write your note…"></textarea>
            </div>

            <div class="field">
                <label for="n-tags">Tags <span class="hint">(optional)</span></label>
                <input type="text" id="n-tags" placeholder="e.g., indieweb, rss" autocapitalize="none"
                    autocomplete="off">
            </div>
        </div>

        <p class="panel-status" id="note-status" aria-live="polite"></p>

        <button class="btn btn-primary" id="note-submit-btn">
            <span class="icon">📝</span>
            Create note issue
        </button>
        <button class="btn" id="note-copy-btn" hidden>
            <span class="icon">📋</span>
            Copy content and open GitHub
        </button>
        <button class="btn-link" type="button" id="note-restore-btn" hidden>Restore the last note I sent</button>
        <button class="btn-link" type="button" id="note-clear-btn">Clear</button>

        <div class="info">
            💾 Your draft is saved on this device as you type. GitHub opens the note form filled in —
            just review and create.
        </div>
    </div>

    <script src="./issue-core.js"></script>
    <script src="./drafts.js"></script>
    <script src="./note.js"></script>
</body>

</html>
