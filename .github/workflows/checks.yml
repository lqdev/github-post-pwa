name: Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 09:17 UTC: catches issue-template changes made in the website repo.
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Unit tests
        run: node --test

      - name: Compare with the website's issue templates
        run: node scripts/check-templates.js
